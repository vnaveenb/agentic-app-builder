<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dev Agent — Project 7</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #09090b;
            --bg-panel: #18181b;
            --bg-panel-solid: #18181b;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(255, 255, 255, 0.2);
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --accent-cyan: #3b82f6; /* Flat blue instead of cyan */
            --accent-violet: #6366f1; /* Flat indigo instead of violet */
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --accent-amber: #f59e0b;
            
            --agent-planner: var(--accent-cyan);
            --agent-developer: var(--accent-emerald);
            --agent-tester: var(--accent-amber);
            --agent-reviewer: var(--accent-violet);
            
            --font-display: 'Clash Display', sans-serif;
            --font-ui: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-ui);
            background: var(--bg-base);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* ── Layout ── */
        .app-layout {
            display: grid;
            grid-template-columns: var(--col-left, 320px) 4px var(--col-center, 400px) 4px 1fr;
            grid-template-rows: 1fr auto;
            height: 100vh;
            padding: 12px 12px 0 12px;
            gap: 8px;
        }

        .gutter {
            grid-row: 1;
            cursor: col-resize;
            position: relative;
            z-index: 10;
            transition: background 0.2s;
            border-radius: 4px;
        }
        .gutter:hover, .gutter.active {
            background: rgba(255, 255, 255, 0.1);
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Left Panel (Controls) ── */
        .left-panel {
            grid-row: 1;
            padding: 24px;
            gap: 20px;
            overflow-y: auto;
        }
        
        .left-panel::-webkit-scrollbar { width: 4px; }
        .left-panel::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }

        .app-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .input-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .idea-input {
            width: 100%;
            min-height: 140px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-ui);
            font-size: 0.95rem;
            line-height: 1.5;
            resize: vertical;
            transition: all 0.3s ease;
        }
        .idea-input:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }
        .idea-input::placeholder { color: var(--text-muted); }

        .styled-select {
            appearance: none;
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-ui);
            font-size: 0.95rem;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }
        .styled-select:focus { outline: none; border-color: var(--accent-violet); }
        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: '▼';
            font-size: 0.7rem;
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .slider-wrapper input[type="range"] {
            flex: 1;
            accent-color: var(--accent-cyan);
            cursor: pointer;
        }
        .slider-value {
            font-family: var(--font-mono);
            color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--accent-cyan);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            position: relative;
            overflow: hidden;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        .btn-primary:active { transform: translateY(1px); }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .meta-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }
        
        .provider-badge {
            align-self: flex-start;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .provider-badge::before { content: '⚡'; color: var(--accent-amber); }

        .session-info {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
        }
        .session-info.visible { display: flex; }
        .session-id {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn-icon {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.2s;
        }
        .btn-icon:hover { color: var(--text-primary); }

        /* Iterate */
        .iterate-section {
            display: none;
            margin-top: 16px;
            padding-top: 24px;
            border-top: 1px solid var(--border-subtle);
        }
        .iterate-section.visible { display: flex; flex-direction: column; gap: 12px; }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 12px;
            border-radius: var(--radius-md);
            font-family: var(--font-ui);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--border-hover);
        }
        .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ── Center Panel (Pipeline & Logs) ── */
        .center-panel { grid-row: 1; }
        
        .pipeline-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-shrink: 0;
            background: rgba(0,0,0,0.2);
        }
        
        .pipeline-flow {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .agent-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 2;
            cursor: pointer;
        }
        
        .agent-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--bg-panel-solid);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }
        
        .agent-node[data-agent="planner"] .agent-icon { color: var(--agent-planner); }
        .agent-node[data-agent="developer"] .agent-icon { color: var(--agent-developer); }
        .agent-node[data-agent="tester"] .agent-icon { color: var(--agent-tester); }
        .agent-node[data-agent="reviewer"] .agent-icon { color: var(--agent-reviewer); }

        .agent-node.running .agent-icon {
            border-color: currentColor;
            animation: pulse-glow 2s ease-in-out infinite;
        }
        
        .agent-node.done .agent-icon {
            background: currentColor;
            color: #000;
        }
        
        .agent-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }
        .agent-node.running .agent-label { color: var(--text-primary); }
        .agent-node.done .agent-label { color: var(--text-primary); }

        .flow-connector {
            flex: 1;
            height: 2px;
            background: var(--border-subtle);
            margin: 0 10px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 6px 0px currentColor; }
            50% { box-shadow: 0 0 18px 4px currentColor; }
        }

        .stream-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: stream-pulse 1.2s ease-in-out infinite;
        }
        @keyframes stream-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        .log-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .event-log {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            font-family: var(--font-ui);
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .event-log::-webkit-scrollbar { width: 4px; }
        .event-log::-webkit-scrollbar-thumb { background: var(--border-subtle); }

        .log-entry {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 12px;
            animation: fade-in 0.3s ease-out;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .log-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .agent-tag {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #000;
        }
        .agent-tag.planner { background: var(--agent-planner); }
        .agent-tag.developer { background: var(--agent-developer); }
        .agent-tag.tester { background: var(--agent-tester); }
        .agent-tag.reviewer { background: var(--agent-reviewer); }
        .agent-tag.system { background: var(--text-secondary); }

        .log-content { color: var(--text-secondary); line-height: 1.5; }
        .log-content strong { color: var(--text-primary); }
        .log-content ul { margin: 8px 0 8px 20px; }
        .log-content li { margin-bottom: 4px; }
        .pass-text { color: var(--agent-developer); }
        .fail-text { color: var(--accent-rose); }

        /* Thinking Details */
        .thinking-details {
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            overflow: hidden;
        }
        .thinking-summary {
            padding: 10px 14px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.02);
            transition: background 0.2s;
        }
        .thinking-summary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }
        .thinking-summary::marker {
            display: none;
        }
        .thinking-summary::-webkit-details-marker {
            display: none;
        }
        .thinking-content {
            padding: 14px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: pre-wrap;
            word-break: break-word;
            border-top: 1px solid var(--border-subtle);
            background: rgba(0,0,0,0.4);
            max-height: 400px;
            overflow-y: auto;
        }
        
        .history-section {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-subtle);
        }
        .history-section.visible { display: flex; }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .history-item {
            padding: 8px 12px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .history-item:hover {
            background: rgba(0,0,0,0.3);
            border-color: var(--border-hover);
        }
        .history-item.active {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--accent-cyan);
            color: var(--text-primary);
        }

        /* ── Right Panel (Workspace) ── */
        .right-panel { grid-row: 1; }
        
        .workspace-tabs {
            display: flex;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0 8px;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 16px 20px;
            color: var(--text-secondary);
            font-family: var(--font-ui);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }
        .tab-btn:hover { color: var(--text-primary); }
        .tab-btn.active { color: var(--text-primary); }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-cyan);
            box-shadow: 0 -2px 10px rgba(6, 182, 212, 0.4);
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow: hidden;
            flex-direction: column;
        }
        .tab-content.active { display: flex; }

        /* Code Editor */
        .file-tabs {
            display: flex;
            overflow-x: auto;
            background: rgba(0,0,0,0.1);
            border-bottom: 1px solid var(--border-subtle);
            padding: 8px 8px 0 8px;
            gap: 4px;
        }
        .file-tabs::-webkit-scrollbar { height: 2px; }
        .file-tabs::-webkit-scrollbar-thumb { background: var(--border-subtle); }
        
        .file-tab {
            padding: 8px 16px;
            background: rgba(255,255,255,0.02);
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .file-tab:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }
        .file-tab.active {
            background: var(--bg-panel-solid);
            border-color: var(--border-subtle);
            color: var(--text-primary);
        }
        .file-tab.unsaved::before {
            content: '●';
            color: var(--accent-amber);
            margin-right: 6px;
            font-size: 0.7rem;
        }

        .editor-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: var(--bg-panel-solid);
            border-bottom: 1px solid var(--border-subtle);
            font-size: 0.8rem;
        }
        .save-hint { color: var(--text-muted); }
        .save-status { color: var(--accent-emerald); opacity: 0; transition: opacity 0.3s; }
        .save-status.visible { opacity: 1; }

        #monacoContainer { flex: 1; min-height: 0; }
        .placeholder-view {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            background: var(--bg-panel-solid);
        }

        /* Preview */
        .preview-toolbar {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border-subtle);
        }
        .btn-preview {
            padding: 8px 16px;
            border-radius: 6px;
            font-family: var(--font-ui);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border-subtle);
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
            transition: all 0.2s;
        }
        .btn-preview:hover:not(:disabled) { background: rgba(255,255,255,0.1); border-color: var(--border-hover); }
        .btn-preview:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-preview.play { color: var(--accent-emerald); border-color: rgba(16, 185, 129, 0.3); }
        .btn-preview.play:hover:not(:disabled) { background: rgba(16, 185, 129, 0.1); border-color: var(--accent-emerald); }
        .btn-preview.stop { color: var(--accent-rose); border-color: rgba(244, 63, 94, 0.3); }
        .btn-preview.stop:hover:not(:disabled) { background: rgba(244, 63, 94, 0.1); border-color: var(--accent-rose); }

        .preview-frame-container { flex: 1; position: relative; background: #fff; }
        .preview-frame { width: 100%; height: 100%; border: none; }
        .preview-overlay {
            position: absolute; inset: 0;
            background: var(--bg-panel-solid);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            z-index: 5;
            transition: opacity 0.3s;
        }
        .preview-overlay.hidden { opacity: 0; pointer-events: none; }

        /* Terminal */
        .terminal-panel { background: #000; flex: 1; display: flex; flex-direction: column; }
        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: #111;
            border-bottom: 1px solid #333;
        }
        .terminal-title { font-family: var(--font-mono); font-size: 0.8rem; color: #888; }
        .terminal-output {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            line-height: 1.6;
            color: #ccc;
        }
        .terminal-output::-webkit-scrollbar { width: 4px; }
        .terminal-output::-webkit-scrollbar-thumb { background: #333; }
        
        .term-src { color: var(--accent-cyan); margin-right: 8px; }
        .term-src.tester { color: var(--accent-amber); }
        .term-src.preview { color: var(--accent-emerald); }
        .term-src.console { color: var(--accent-rose); }

        /* ── Bottom Bar ── */
        .bottom-bar {
            grid-column: 1 / -1;
            padding: 12px 16px 16px 16px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .progress-track {
            flex: 1;
            height: 4px;
            background: var(--bg-panel);
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid var(--border-subtle);
        }
        .progress-fill {
            height: 100%;
            background: var(--accent-cyan);
            width: 0%;
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .btn-download {
            padding: 8px 20px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid var(--border-hover);
            border-radius: 20px;
            font-family: var(--font-ui);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.5;
            pointer-events: none;
        }
        .btn-download.enabled {
            opacity: 1;
            pointer-events: auto;
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--accent-emerald);
            color: var(--accent-emerald);
        }
        .btn-download.enabled:hover {
            background: var(--accent-emerald);
            color: #000;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

    </style>
</head>
<body>
    <div class="app-layout" id="appLayout">
        
        <!-- LEFT PANEL -->
        <div class="panel left-panel" id="leftPanel">
            <div class="app-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                Dev Agent
            </div>

            <div class="input-group">
                <label class="input-label">Project Vision</label>
                <textarea class="idea-input" id="ideaInput" placeholder="Describe your application idea...&#10;&#10;e.g., A minimalist pomodoro timer with a neon dark theme using React."></textarea>
            </div>

            <div class="input-group">
                <label class="input-label">Runtime Environment</label>
                <div class="select-wrapper">
                    <select class="styled-select" id="runtimeSelect">
                        <option value="auto">Auto-detect from prompt</option>
                        <option value="python">Python (FastAPI/Flask)</option>
                        <option value="node">Node.js (Express)</option>
                        <option value="react">React (CDN)</option>
                        <option value="angular">Angular (CDN)</option>
                        <option value="static">Static HTML/JS</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Auto-Iterations</label>
                <div class="slider-wrapper">
                    <input type="range" id="iterSlider" min="1" max="5" value="2">
                    <span class="slider-value" id="iterValue">2</span>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Orchestration Backend</label>
                <div class="select-wrapper">
                    <select class="styled-select" id="backendSelect">
                        <option value="langgraph">LangGraph (State Machine)</option>
                        <option value="crewai">CrewAI (Role-Based)</option>
                    </select>
                </div>
            </div>

            <button class="btn-primary" id="generateBtn">Initialize Build</button>

            <div class="iterate-section" id="iterateSection">
                <label class="input-label">Feedback Loop</label>
                <textarea class="idea-input" id="iterateInput" style="min-height: 80px;" placeholder="What should be changed?"></textarea>
                <button class="btn-secondary" id="iterateBtn">Apply Iteration</button>
            </div>
            
            <div class="history-section" id="historySection">
                <label class="input-label">Version History</label>
                <div class="history-list" id="historyList"></div>
            </div>

            <div class="meta-info">
                <div class="provider-badge" id="providerBadge">Connecting...</div>
                <div class="session-info" id="sessionInfo">
                    <span class="session-id" id="sessionId"></span>
                    <button class="btn-icon" id="copySession" title="Copy ID">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="gutter" id="gutterLeft"></div>

        <!-- CENTER PANEL -->
        <div class="panel center-panel" id="centerPanel">
            <div class="pipeline-header">
                <div class="input-label">Pipeline Status</div>
                <div class="pipeline-flow">
                    <div class="agent-node" data-agent="planner" id="node-planner">
                        <div class="agent-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg></div>
                        <div class="agent-label">Plan</div>
                    </div>
                    <div class="flow-connector"></div>
                    <div class="agent-node" data-agent="developer" id="node-developer">
                        <div class="agent-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg></div>
                        <div class="agent-label">Build</div>
                    </div>
                    <div class="flow-connector"></div>
                    <div class="agent-node" data-agent="tester" id="node-tester">
                        <div class="agent-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>
                        <div class="agent-label">Test</div>
                    </div>
                    <div class="flow-connector"></div>
                    <div class="agent-node" data-agent="reviewer" id="node-reviewer">
                        <div class="agent-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg></div>
                        <div class="agent-label">Review</div>
                    </div>
                </div>
            </div>
            
            <div class="log-container">
                <div class="event-log" id="eventLog"></div>
            </div>
        </div>

        <div class="gutter" id="gutterRight"></div>

        <!-- RIGHT PANEL -->
        <div class="panel right-panel" id="rightPanel">
            <div class="workspace-tabs">
                <button class="tab-btn active" data-target="codeContent">Code</button>
                <button class="tab-btn" data-target="previewContent">Preview</button>
                <button class="tab-btn" data-target="terminalContent">Logs</button>
            </div>

            <!-- Code Tab -->
            <div class="tab-content active" id="codeContent">
                <div class="file-tabs" id="fileTabs"></div>
                <div class="editor-toolbar">
                    <span class="save-hint">Ctrl+S to save & hot-reload</span>
                    <span class="save-status" id="saveStatus">✓ Saved</span>
                </div>
                <div id="monacoContainer" style="display:none;"></div>
                <div class="placeholder-view" id="codePlaceholder">Workspace empty. Initialize build to generate code.</div>
            </div>

            <!-- Preview Tab -->
            <div class="tab-content" id="previewContent">
                <div class="preview-toolbar">
                    <button class="btn-preview play" id="launchPreviewBtn" disabled>▶ Start Server</button>
                    <button class="btn-preview stop" id="stopPreviewBtn" disabled>■ Stop</button>
                    <button class="btn-preview" id="refreshPreviewBtn" disabled>↻ Reload</button>
                </div>
                <div class="preview-frame-container">
                    <div class="preview-overlay" id="previewOverlay">Preview inactive</div>
                    <iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts allow-forms allow-same-origin" style="display:none;"></iframe>
                </div>
            </div>

            <!-- Terminal Tab -->
            <div class="tab-content" id="terminalContent">
                <div class="terminal-panel">
                    <div class="terminal-header">
                        <span class="terminal-title">STDOUT / STDERR</span>
                        <button class="btn-icon" id="terminalClearBtn" title="Clear">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                    <div class="terminal-output" id="terminalOutput"></div>
                </div>
            </div>
        </div>

        <!-- BOTTOM BAR -->
        <div class="bottom-bar">
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <button class="btn-download" id="downloadBtn">Export .ZIP</button>
        </div>
    </div>

    <!-- Monaco Editor -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
    <script>
    (function() {
        // State
        let sessionId = null;
        let eventSource = null;
        let editor = null;
        let editorModels = {};
        let activeFile = null;
        let completedAgents = 0;
        
        // DOM refs
        const appLayout = document.getElementById('appLayout');
        const ideaInput = document.getElementById('ideaInput');
        const runtimeSelect = document.getElementById('runtimeSelect');
        const iterSlider = document.getElementById('iterSlider');
        const iterValue = document.getElementById('iterValue');
        const generateBtn = document.getElementById('generateBtn');
        const providerBadge = document.getElementById('providerBadge');
        const sessionInfo = document.getElementById('sessionInfo');
        const sessionIdEl = document.getElementById('sessionId');
        const iterateSection = document.getElementById('iterateSection');
        const iterateInput = document.getElementById('iterateInput');
        const iterateBtn = document.getElementById('iterateBtn');
        const eventLog = document.getElementById('eventLog');
        const progressFill = document.getElementById('progressFill');
        const downloadBtn = document.getElementById('downloadBtn');
        const monacoContainer = document.getElementById('monacoContainer');
        const codePlaceholder = document.getElementById('codePlaceholder');
        const fileTabs = document.getElementById('fileTabs');
        const saveStatus = document.getElementById('saveStatus');
        const previewOverlay = document.getElementById('previewOverlay');
        const previewFrame = document.getElementById('previewFrame');
        const terminalOutput = document.getElementById('terminalOutput');
        
        const historySection = document.getElementById('historySection');
        const historyList = document.getElementById('historyList');
        
        let currentStreamAgent = null;
        let currentDetails = null;
        let currentDetailsContent = null;
        let activeAgentFilter = null;

        // Agent Filtering
        document.querySelectorAll('.agent-node').forEach(n => {
            n.addEventListener('click', () => {
                const agent = n.dataset.agent;
                if (activeAgentFilter === agent) {
                    activeAgentFilter = null;
                    n.style.opacity = '1';
                    document.querySelectorAll('.agent-node').forEach(other => other.style.opacity = '1');
                } else {
                    activeAgentFilter = agent;
                    document.querySelectorAll('.agent-node').forEach(other => other.style.opacity = '0.4');
                    n.style.opacity = '1';
                }
                document.querySelectorAll('.log-entry, .thinking-details').forEach(el => {
                    if (!activeAgentFilter || el.dataset.agent === activeAgentFilter) el.style.display = '';
                    else el.style.display = 'none';
                });
            });
        });

        // Init
        fetch('/health').then(r => r.json()).then(d => { providerBadge.innerHTML = '⚡ ' + d.provider; });
        iterSlider.addEventListener('input', () => { iterValue.textContent = iterSlider.value; });

        // Panel Resizing (Gutters)
        (function initResize() {
            const gutters = [document.getElementById('gutterLeft'), document.getElementById('gutterRight')];
            let dragging = null, startX = 0, startLeftW = 0, startCenterW = 0, startRightW = 0;
            const leftPanel = document.getElementById('leftPanel');
            const centerPanel = document.getElementById('centerPanel');
            const rightPanel = document.getElementById('rightPanel');

            function onDown(which, e) {
                dragging = which;
                startX = e.clientX || (e.touches && e.touches[0].clientX);
                startLeftW = leftPanel.getBoundingClientRect().width;
                startCenterW = centerPanel.getBoundingClientRect().width;
                startRightW = rightPanel.getBoundingClientRect().width;
                gutters[which === 'left' ? 0 : 1].classList.add('active');
            }
            function onMove(e) {
                if (!dragging) return;
                const x = e.clientX || (e.touches && e.touches[0].clientX);
                const delta = x - startX;
                if (dragging === 'left') {
                    appLayout.style.setProperty('--col-left', Math.max(200, startLeftW + delta) + 'px');
                    appLayout.style.setProperty('--col-center', Math.max(300, startCenterW - delta) + 'px');
                } else {
                    appLayout.style.setProperty('--col-center', Math.max(300, startCenterW + delta) + 'px');
                }
                if (editor) requestAnimationFrame(() => editor.layout());
            }
            function onUp() {
                dragging = null;
                gutters.forEach(g => g.classList.remove('active'));
            }
            gutters[0].addEventListener('mousedown', e => onDown('left', e));
            gutters[1].addEventListener('mousedown', e => onDown('right', e));
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        })();

        // Tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.target).classList.add('active');
                if (btn.dataset.target === 'codeContent' && editor) editor.layout();
            });
        });

        // Monaco
        require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs' } });
        require(['vs/editor/editor.main'], function() {
            monaco.editor.defineTheme('tech-dark', {
                base: 'vs-dark',
                inherit: true,
                rules: [],
                colors: { 'editor.background': '#121214', 'editor.lineHighlightBackground': '#1f1f23' },
            });
        });

        function loadFiles(files) {
            if (!window.monaco) { setTimeout(() => loadFiles(files), 200); return; }
            if (!editor) {
                codePlaceholder.style.display = 'none';
                monacoContainer.style.display = 'block';
                editor = monaco.editor.create(monacoContainer, {
                    theme: 'tech-dark', fontSize: 13, minimap: { enabled: false },
                    fontFamily: 'JetBrains Mono', automaticLayout: true
                });
                editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, saveFiles);
            }
            Object.values(editorModels).forEach(m => m.dispose());
            editorModels = {};
            fileTabs.innerHTML = '';
            
            const mapExt = { py:'python', js:'javascript', html:'html', css:'css', json:'json', md:'markdown' };
            const names = Object.keys(files);
            names.forEach(fname => {
                const ext = fname.split('.').pop();
                const lang = mapExt[ext] || 'plaintext';
                const model = monaco.editor.createModel(files[fname], lang, monaco.Uri.parse('file:///'+fname));
                editorModels[fname] = model;
                model.onDidChangeContent(() => {
                    document.querySelector(`[data-file="${fname}"]`).classList.add('unsaved');
                });
                const tab = document.createElement('div');
                tab.className = 'file-tab';
                tab.textContent = fname;
                tab.dataset.file = fname;
                tab.onclick = () => switchFile(fname);
                fileTabs.appendChild(tab);
            });
            if (names.length) switchFile(names[0]);
        }

        function switchFile(fname) {
            activeFile = fname;
            editor.setModel(editorModels[fname]);
            document.querySelectorAll('.file-tab').forEach(t => t.classList.toggle('active', t.dataset.file === fname));
        }

        async function saveFiles() {
            if (!sessionId || !editor) return;
            const payload = {};
            for (let [f, m] of Object.entries(editorModels)) payload[f] = m.getValue();
            document.querySelectorAll('.unsaved').forEach(t => t.classList.remove('unsaved'));
            saveStatus.classList.add('visible');
            setTimeout(() => saveStatus.classList.remove('visible'), 2000);
            await fetch(`/files/${sessionId}`, {
                method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({files: payload})
            });
        }

        // Action Handlers
        generateBtn.onclick = async () => {
            const idea = ideaInput.value.trim();
            if (!idea) return;
            generateBtn.disabled = true;
            generateBtn.textContent = 'Initializing...';
            resetUI();
            const resp = await fetch('/generate', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ idea, runtime: runtimeSelect.value, max_iterations: parseInt(iterSlider.value), backend: document.getElementById('backendSelect').value })
            });
            const data = await resp.json();
            sessionId = data.session_id;
            sessionIdEl.textContent = sessionId;
            sessionInfo.classList.add('visible');
            connectSSE();
        };

        iterateBtn.onclick = async () => {
            const feedback = iterateInput.value.trim();
            if(!feedback) return;
            iterateBtn.disabled = true;
            generateBtn.disabled = true;
            resetUI(true);
            await fetch(`/iterate/${sessionId}`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ feedback })
            });
            connectSSE();
        };

        function resetUI(keepSession = false) {
            eventLog.innerHTML = '';
            terminalOutput.innerHTML = '';
            progressFill.style.width = '0%';
            completedAgents = 0;
            document.querySelectorAll('.agent-node').forEach(n => {
                n.classList.remove('running', 'done');
            });
            currentStreamAgent = null;
            currentDetails = null;
            currentDetailsContent = null;
        }

        // SSE & Streaming logic
        function connectSSE() {
            if (eventSource) eventSource.close();
            eventSource = new EventSource(`/stream/${sessionId}`);
            
            let currentChunkBuffer = '';

            eventSource.onmessage = ({ data }) => {
                const ev = JSON.parse(data);

                if (ev.event === 'agent_start') {
                    document.getElementById(`node-${ev.agent}`).classList.add('running');
                    currentStreamAgent = ev.agent;
                    currentChunkBuffer = '';
                    
                    const details = document.createElement('details');
                    details.className = 'thinking-details';
                    details.dataset.agent = ev.agent;
                    details.open = true;
                    if (activeAgentFilter && activeAgentFilter !== ev.agent) details.style.display = 'none';
                    
                    const summary = document.createElement('summary');
                    summary.className = 'thinking-summary';
                    summary.innerHTML = `<span class="stream-indicator" style="background:var(--agent-${ev.agent});"></span> ${ev.agent} is thinking...`;
                    
                    const content = document.createElement('div');
                    content.className = 'thinking-content';
                    
                    details.appendChild(summary);
                    details.appendChild(content);
                    eventLog.appendChild(details);
                    eventLog.scrollTop = eventLog.scrollHeight;
                    
                    currentDetails = details;
                    currentDetailsContent = content;
                }
                else if (ev.event === 'llm_chunk') {
                    if (ev.agent === currentStreamAgent && currentDetailsContent) {
                        currentChunkBuffer += ev.chunk;
                        currentDetailsContent.textContent = currentChunkBuffer;
                        eventLog.scrollTop = eventLog.scrollHeight;
                    }
                }
                else if (ev.event === 'agent_complete') {
                    const node = document.getElementById(`node-${ev.agent}`);
                    node.classList.remove('running');
                    node.classList.add('done');
                    completedAgents++;
                    progressFill.style.width = `${(completedAgents / 4) * 100}%`;
                    if (currentDetails) {
                        currentDetails.querySelector('.thinking-summary').innerHTML = `${ev.agent} reasoning`;
                        currentDetails.open = false;
                        currentDetails = null;
                        currentDetailsContent = null;
                    }
                }
                else if (ev.event === 'agent_output') {
                    appendLog(ev.agent, ev.data);
                }
                else if (ev.event === 'terminal') {
                    const l = document.createElement('div');
                    l.innerHTML = `<span class="term-src ${ev.data.source}">[${ev.data.source}]</span> ${escape(ev.data.text)}`;
                    terminalOutput.appendChild(l);
                    terminalOutput.scrollTop = terminalOutput.scrollHeight;
                }
                else if (ev.event === 'pipeline_done') {
                    loadFiles(ev.files);
                    generateBtn.disabled = false;
                    generateBtn.textContent = 'Initialize Build';
                    iterateSection.classList.add('visible');
                    iterateBtn.disabled = false;
                    downloadBtn.classList.add('enabled');
                    document.getElementById('launchPreviewBtn').disabled = false;
                    fetchHistory();
                    eventSource.close();
                }
                else if (ev.event === 'error') {
                    appendLog('system', { error: ev.message });
                    generateBtn.disabled = false;
                    generateBtn.textContent = 'Initialize Build';
                    eventSource.close();
                }
            };
        }

        function appendLog(agent, data) {
            const el = document.createElement('div');
            el.className = 'log-entry';
            el.dataset.agent = agent;
            if (activeAgentFilter && activeAgentFilter !== agent) el.style.display = 'none';
            const keys = Object.keys(data).map(k => `<li><strong>${k}:</strong> ${JSON.stringify(data[k]).substring(0, 150)}</li>`).join('');
            el.innerHTML = `<div class="log-header"><span class="agent-tag ${agent}">${agent}</span></div>
                            <div class="log-content"><ul>${keys}</ul></div>`;
            eventLog.appendChild(el);
            eventLog.scrollTop = eventLog.scrollHeight;
        }

        async function fetchHistory() {
            if (!sessionId) return;
            const res = await fetch(`/history/${sessionId}`);
            if (!res.ok) return;
            const data = await res.json();
            historySection.classList.add('visible');
            historyList.innerHTML = '';
            data.versions.forEach(v => {
                const item = document.createElement('div');
                item.className = 'history-item' + (v.is_current ? ' active' : '');
                item.innerHTML = `<span>${v.description}</span> <span>v${v.version}</span>`;
                item.onclick = () => checkoutVersion(v.version);
                historyList.appendChild(item);
            });
        }

        async function checkoutVersion(version) {
            if (!sessionId) return;
            const res = await fetch(`/checkout/${sessionId}/${version}`, {method: 'POST'});
            if (res.ok) {
                const data = await res.json();
                loadFiles(data.files);
                fetchHistory();
            }
        }

        function escape(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        // Preview Actions
        const btnPlay = document.getElementById('launchPreviewBtn');
        const btnStop = document.getElementById('stopPreviewBtn');
        const btnRef = document.getElementById('refreshPreviewBtn');
        
        btnPlay.onclick = async () => {
            btnPlay.disabled = true;
            previewOverlay.textContent = "Booting container...";
            previewOverlay.classList.remove('hidden');
            const r = await fetch(`/preview/${sessionId}/start`, {method:'POST'});
            if(r.ok) {
                previewFrame.style.display = 'block';
                previewFrame.src = `/preview/${sessionId}/`;
                previewOverlay.classList.add('hidden');
                btnStop.disabled = false;
                btnRef.disabled = false;
            } else {
                previewOverlay.textContent = "Failed to start preview.";
                btnPlay.disabled = false;
            }
        };

        btnStop.onclick = async () => {
            await fetch(`/preview/${sessionId}/stop`, {method:'POST'});
            previewFrame.src = 'about:blank';
            previewFrame.style.display = 'none';
            previewOverlay.textContent = "Preview inactive";
            previewOverlay.classList.remove('hidden');
            btnStop.disabled = true;
            btnRef.disabled = true;
            btnPlay.disabled = false;
        };

        btnRef.onclick = () => { if(previewFrame.src) previewFrame.src = previewFrame.src; };

        // Export
        downloadBtn.onclick = () => {
            if(sessionId) window.location.href = `/download/${sessionId}`;
        };

        document.getElementById('terminalClearBtn').onclick = () => { terminalOutput.innerHTML = ''; };

        document.getElementById('copySession').onclick = () => {
            navigator.clipboard.writeText(sessionId);
        };
    })();
    </script>
</body>
</html>
