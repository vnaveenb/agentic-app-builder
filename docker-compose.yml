services:
  app:
    build: .
    ports:
      - "8007:8007"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://devagent:devagent@postgres:5432/devagent
      REDIS_URL: redis://redis:6379/0
      # Delegate ALL generated-code execution (tests + previews) to the
      # isolated sandbox service, which holds no secrets.
      SANDBOX_URL: http://sandbox:8009
    volumes:
      - appdata:/app/data
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox:
        condition: service_started
    networks:
      - data
      - exec
    restart: unless-stopped

  # Isolated executor for untrusted, model-generated code. Deliberately has NO
  # access to .env secrets, the database, or Redis, and sits on a network that
  # cannot reach them. Previews/tests run here; the app proxies to it.
  sandbox:
    build: .
    command: ["uvicorn", "src.sandbox_service.app:app", "--host", "0.0.0.0", "--port", "8009"]
    # NOTE: no env_file, no DATABASE_URL/REDIS_URL, no LLM keys.
    networks:
      - exec
    # Headroom for npm install + bundler (Angular builds are memory-hungry).
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 512
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devagent
      POSTGRES_USER: devagent
      POSTGRES_PASSWORD: devagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devagent"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - data
    restart: unless-stopped

networks:
  data:    # app ↔ postgres ↔ redis (secrets live here)
  exec:    # app ↔ sandbox (untrusted execution; no DB/Redis/secret reach)

volumes:
  pgdata:
  redisdata:
  appdata:
