name: CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  lint-typecheck-test:
    name: Lint, Type-check, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check src/ shared/ tests/
      - name: Type-check
        run: mypy src/ shared/
      - name: Test
        run: pytest tests/ -m "not integration" -v --tb=short

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-dev-agent:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ai-dev-agent:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/ai-dev-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
